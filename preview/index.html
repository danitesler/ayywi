<!doctype html>
<html lang="en" class="ayy-scrollbar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ayywi design system</title>
    <meta name="description" content="ayywi — a lightweight, framework-agnostic, AI-first design system. Browse tokens and components in both themes, LTR and RTL, rendered from React or plain HTML." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("ayy-theme");
          if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Sora:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- The theme font pairings (THEME_FONTS) only show once someone picks one, so they don't hold up the first paint. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=Literata:wght@400..700&family=Space+Grotesk:wght@400..700&family=DM+Sans:wght@400..700&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:wght@400..700&family=Figtree:wght@400..700&family=Syne:wght@400..700&family=Manrope:wght@400..700&family=Lexend:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
