        <label class="ayy-segmented-control__option" title="Mobile"><input type="radio" name="showcase-device-basic" value="mobile" aria-label="Mobile" /><svg class="ayy-icon" data-ayy-icon="smartphone" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.5 2H10.5C8.14298 2 6.96447 2 6.23223 2.73223C5.5 3.46447 5.5 4.64298 5.5 7V17C5.5 19.357 5.5 20.5355 6.23223 21.2678C6.96447 22 8.14298 22 10.5 22H13.5C15.857 22 17.0355 22 17.7678 21.2678C18.5 20.5355 18.5 19.357 18.5 17V7C18.5 4.64298 18.5 3.46447 17.7678 2.73223C17.0355 2 15.857 2 13.5 2Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path><path d="M12.125 19H12M12.25 19C12.25 19.1381 12.1381 19.25 12 19.25C11.8619 19.25 11.75 19.1381 11.75 19C11.75 18.8619 11.8619 18.75 12 18.75C12.1381 18.75 12.25 18.8619 12.25 19Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg></label>
      </div>
      <ayy-popover side="bottom" align="end">
        <span class="ayy-tooltip">
          <button type="button" class="ayy-button ayy-button--outline ayy-button--icon-sm" popovertarget="showcase-props-popover" aria-label="Props" aria-haspopup="dialog">
            <svg class="ayy-icon" data-ayy-icon="sliders-horizontal" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.99963 5.00055L9.99963 5.00031" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M12.9996 5.00031L19.9996 5.00031" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M15.9996 9.00031L15.9996 15.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M9.99963 2.00031L9.99963 8.00031" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M11.9996 16.0003L11.9996 22.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M15.9996 12.0001L19.9996 12.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M3.99963 12.0005L12.9996 12.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M11.9996 19.0003L19.9996 19.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path><path d="M3.99963 19.0005L8.99963 19.0003" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path></svg>
          </button>
          <span role="tooltip" class="ayy-tooltip__content">Props</span>
        </span>
        <div class="ayy-popover" id="showcase-props-popover" popover role="dialog" aria-label="Card properties" style="inline-size: 14rem">
          <div class="ayy-stack" style="--ayy-gap: var(--ayy-space-3)">
            <div class="ayy-spread">
              <label class="ayy-label" for="sc-badge-html">Live badge</label>
              <input type="checkbox" role="switch" class="ayy-switch" id="sc-badge-html" checked="" />
            </div>
            <div class="ayy-spread">
              <label class="ayy-label" for="sc-desc-html">Description</label>
              <input type="checkbox" role="switch" class="ayy-switch" id="sc-desc-html" checked="" />
            </div>
            <div class="ayy-spread">
              <label class="ayy-label" for="sc-footer-html">Footer</label>
              <input type="checkbox" role="switch" class="ayy-switch" id="sc-footer-html" />
            </div>
          </div>
        </div>
      </ayy-popover>
    </div>
  </div>
  <div class="ayy-showcase__stage">
    <div class="ayy-showcase__viewport" data-device="desktop">
      <div class="ayy-showcase__body">
        <div class="ayy-card" style="inline-size: 100%">
          <div class="ayy-card__header">
            <div class="ayy-spread">
              <h4 class="ayy-card__title">Analytics Overview</h4>
              <span class="ayy-badge ayy-badge--outline">Live</span>
            </div>
            <p class="ayy-card__description">Real-time activity and subscriber growth metrics across all active channels.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
