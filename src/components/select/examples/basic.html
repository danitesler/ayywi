<div class="ayy-stack" style="inline-size: min(100%, 20rem)">
  <div class="ayy-field">
    <label class="ayy-label" for="region-html">Region</label>
    <div class="ayy-select">
      <select class="ayy-select__control" id="region-html">
        <option value="us">United States</option>
        <option value="eu" selected>Europe</option>
        <option value="apac">Asia Pacific</option>
      </select>
    </div>
  </div>
  <div class="ayy-field">
    <label class="ayy-label" for="title-font-html">Title font</label>
    <div class="ayy-select">
      <select class="ayy-select__control" id="title-font-html">
        <option value="heading" selected>Unbounded</option>
        <option value="body">Sora</option>
        <option value="mono">Monospace</option>
      </select>
      <span class="ayy-select__picture" data-value="heading" aria-hidden="true"><span style="font-family: var(--ayy-font-heading)">Aa</span></span>
      <span class="ayy-select__picture" data-value="body" hidden aria-hidden="true"><span style="font-family: var(--ayy-font-body)">Aa</span></span>
      <span class="ayy-select__picture" data-value="mono" hidden aria-hidden="true"><span style="font-family: var(--ayy-font-mono)">Aa</span></span>
    </div>
  </div>
  <div class="ayy-select ayy-select--sm">
    <select class="ayy-select__control" aria-label="Sort by">
      <option value="recent">Most recent</option>
      <option value="name">Name</option>
    </select>
  </div>
  <div class="ayy-select">
    <select class="ayy-select__control" aria-label="Plan" disabled>
      <option>Enterprise</option>
    </select>
  </div>
</div>
