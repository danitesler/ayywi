<!-- Pointer tracking comes from ayywi/elements (or call trackSpotlight on pointermove yourself). -->
<div class="ayy-card ayy-card--interactive ayy-card--spotlight" style="width: 240px; --ayy-spot: var(--ayy-accent-product)">
  <div class="ayy-card__header">
    <span class="ayy-badge ayy-badge--info">Product</span>
    <h3 class="ayy-card__title">Roadmap</h3>
    <p class="ayy-card__description">Move your pointer over me.</p>
  </div>
</div>
<div class="ayy-card ayy-card--interactive ayy-card--spotlight" style="width: 240px; --ayy-spot: var(--ayy-accent-ai)">
  <div class="ayy-card__header">
    <span class="ayy-badge ayy-badge--ai">AI</span>
    <h3 class="ayy-card__title">Assistant</h3>
    <p class="ayy-card__description">Colour comes from the content.</p>
  </div>
</div>
