<!-- <ayy-menu> (ayywi/elements) adds placement and the menu keyboard model, and fires "ayy-select" with the item's data-value. -->
<ayy-menu>
  <button type="button" class="ayy-button ayy-button--outline" popovertarget="project-menu-html" aria-haspopup="menu">Project actions</button>
  <div class="ayy-menu" id="project-menu-html" popover role="menu">
    <div class="ayy-menu__label" role="presentation">Marketing site</div>
    <button type="button" class="ayy-menu__item" role="menuitem" data-value="rename">Rename <span class="ayy-menu__shortcut">⌘R</span></button>
    <button type="button" class="ayy-menu__item" role="menuitem" data-value="duplicate">Duplicate <span class="ayy-menu__shortcut">⌘D</span></button>
    <button type="button" class="ayy-menu__item" role="menuitem" disabled>Transfer ownership</button>
    <div class="ayy-menu__separator" role="separator"></div>
    <button type="button" class="ayy-menu__item ayy-menu__item--destructive" role="menuitem" data-value="delete">Delete project</button>
  </div>
</ayy-menu>
