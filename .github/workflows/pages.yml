name: Preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      # The site's real URL, so copied prompts link it (and keep-versions knows where the earlier releases are).
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm preview:build
        env:
          VITE_AYYWI_SITE: ${{ steps.pages.outputs.base_url }}/
      # A deploy replaces the site: bring the earlier releases' files (v/<release>/) along.
      - run: node scripts/keep-versions.mjs
        env:
          AYYWI_SITE: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
